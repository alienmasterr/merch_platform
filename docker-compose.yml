services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: merch
      POSTGRES_PASSWORD: merch
      POSTGRES_DB: merch
    ports: ["5433:5432"]
    
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
      image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
      command: server /data --console-address ":9001"
      environment:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
      ports: ["9000:9000", "9001:9001"]
      volumes: [miniodata:/data]

  # Локальна пошта: приймає SMTP на 1025, усі листи видно у веб-інтерфейсі http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  miniodata:
